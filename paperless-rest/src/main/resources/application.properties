spring.application.name=paperless-rest
#logging.level.root=DEBUG

spring.config.import=optional:file:paperless-rest/.env[.properties],optional:file:paperless-common/.env[.properties]

# DB Configuration
spring.datasource.url=${DATABASE_URL}
spring.jpa.database-platform=${DATABASE_DIALECT}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.username=${DATABASE_USERNAME}
# Servlet Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
# flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=paperless
spring.flyway.create-schemas=true
