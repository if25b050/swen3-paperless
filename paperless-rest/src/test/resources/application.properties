spring.application.name=paperless-rest
#logging.level.root=DEBUG
# DB Configuration
# Servlet Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
# flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# No schema logic for tests with h2, because it breaks things
#spring.flyway.schemas=paperless
#spring.flyway.create-schemas=true
# DB Configuration
spring.datasource.url=jdbc:h2:mem:paperless;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.password=paperless
spring.datasource.username=paperless