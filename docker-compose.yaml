services:
  db:
    image: postgres:17.6
    container_name: PaperlessDB
    restart: unless-stopped
    profiles:
      - frontend
      - backend
      - services
      - full
    environment:
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
      PGDATA: /data/postgres
      POSTGRES_DB: paperless
    ports:
      - "5432:5432"
    volumes:
      - db:/data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d paperless -U paperless" ]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    restart: unless-stopped
    depends_on:
      - db
      - rustfs
      - rabbitmq
      - otel-collector
    profiles:
      - backend
      - full
    build:
      dockerfile: rest.Dockerfile
    env_file:
      - paperless-common/.env
      - paperless-rest/.env
    environment:
      DATABASE_URL: "jdbc:postgresql://db:5432/paperless"
      S3_URL: "http://rustfs:9000"
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: "paperless-rest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_TRACES_EXPORTER: "otlp"
    volumes:
      - ./agent/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar
    ports:
      - "8080:8080"
  ocr:
    restart: unless-stopped
    depends_on:
      - rustfs
      - rabbitmq
    profiles:
      - backend
      - full
    build:
      dockerfile: ocr.Dockerfile
    env_file:
      - paperless-common/.env
    environment:
      S3_URL: "http://rustfs:9000"
  frontend:
    restart: unless-stopped
    profiles:
      - frontend
      - full
    build:
      dockerfile: frontend.Dockerfile
    ports:
      - "4200:8080"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    profiles:
      - backend
      - services
      - full
    env_file:
      - path: paperless-common/.env
        required: true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" # Message Queue
      - "15672:15672" # Management-Plugin
    #      - "15692:15692" # Prometheus-Metrics
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

  rustfs:
    image: rustfs/rustfs:1.0.1
    depends_on:
      - volume-permission-helper
    profiles:
      - backend
      - services
      - full
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    env_file:
      - path: paperless-common/.env
        required: true
    environment:
      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${S3_ACCESSKEY}
      - RUSTFS_SECRET_KEY=${S3_SECRETKEY}
      - RUSTFS_OBS_LOGGER_LEVEL=warn
      - RUSTFS_OBS_LOG_DIRECTORY=/app/logs
      # Keep strict disk topology checks enabled by default.
      # For local testing only, set `RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true` explicitly.
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-false}

    volumes:
      - rustfs_data:/data/rustfs
      - rustfs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # Default behavior:
      # - HTTP when RUSTFS_TLS_PATH is unset
      # - HTTPS when RUSTFS_TLS_PATH is set
      # - loopback TLS uses `-k` unless strict host+CA values are provided
      #
      # Strict TLS example:
      # - set RUSTFS_HEALTHCHECK_HOST to a SAN-covered hostname
      # - optionally set RUSTFS_HEALTHCHECK_CA (defaults to /opt/tls/ca.crt when present)
      test:
        [
          "CMD",
          "sh", "-ec",
          "host=\"$${RUSTFS_HEALTHCHECK_HOST:-127.0.0.1}\"; scheme=\"http\"; set -- -fsS; \
          if [ -n \"$${RUSTFS_TLS_PATH:-}\" ]; then \
            scheme=\"https\"; \
            ca_path=\"$${RUSTFS_HEALTHCHECK_CA:-}\"; \
            if [ -z \"$${ca_path}\" ] && [ -f /opt/tls/ca.crt ]; then ca_path=/opt/tls/ca.crt; fi; \
            case \"$${host}\" in 127.0.0.1|localhost) strict_host=false ;; *) strict_host=true ;; esac; \
            if [ \"$${strict_host}\" = true ] && [ -n \"$${ca_path}\" ]; then \
              set -- \"$${@}\" --cacert \"$${ca_path}\" --resolve \"$${host}:9000:127.0.0.1\" --resolve \"$${host}:9001:127.0.0.1\"; \
            else \
              set -- \"$${@}\" -k; \
            fi; \
          fi; \
          curl \"$${@}\" \"$${scheme}://$${host}:9000/health\" && \
          curl \"$${@}\" \"$${scheme}://$${host}:9001/rustfs/console/health\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  volume-permission-helper:
    image: alpine
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data /logs &&
        echo 'Volume Permissions fixed' &&
        exit 0
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - elasticsearch

volumes:
  db:
  rustfs_data:
  rustfs_logs:
  rabbitmq-lib:
  rabbitmq-log:
  es_data:

