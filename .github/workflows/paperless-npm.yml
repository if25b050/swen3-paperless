name: Paperless CI Frontend

on:
  push:
    branches: [ "main" ]
    paths: paperless-frontend/**
  pull_request:
    branches: [ "main" ]
    paths: paperless-frontend/**

defaults:
  run:
    working-directory: paperless-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npm run test
        npm run build
